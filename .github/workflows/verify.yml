name: Compare with Apache Maven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphviz and Python YAML
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz python3-yaml
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compare three runtime graphs and record artifact transfers
        run: PYTHON=/usr/bin/python3 sh examples/reference/compare.sh
      - name: Save graphs and observations
        uses: actions/upload-artifact@v4
        with:
          name: maven-comparison
          path: build/reference/
